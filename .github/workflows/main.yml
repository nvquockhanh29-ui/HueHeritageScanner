name: Build Hue Heritage Scanner IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build Unsigned IPA on Cloud Mac
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Compile Swift App directly
        run: |
          mkdir -p Payload/HueHeritageScanner.app
          
          # Biên dịch trực tiếp Swift cho chip Apple ARM64 (iPhone)
          xcrun -sdk iphoneos swiftc \
                -target arm64-apple-ios16.0 \
                -O \
                -framework SwiftUI \
                -framework ARKit \
                -framework SceneKit \
                -framework Combine \
                -framework Metal \
                HueHeritageScannerApp.swift \
                ARScannerManager.swift \
                ContentView.swift \
                -o Payload/HueHeritageScanner.app/HueHeritageScanner
          
          # Sao chép Info.plist vào gói ứng dụng
          cp Info.plist Payload/HueHeritageScanner.app/Info.plist
          
          # Đóng gói tệp IPA
          zip -r HueHeritageScanner.ipa Payload
          echo "✅ Đã đóng gói thành công tệp IPA trực tiếp!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HueHeritageScanner-IPA
          path: HueHeritageScanner.ipa
