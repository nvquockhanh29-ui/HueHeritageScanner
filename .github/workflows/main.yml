name: Build Hue Heritage Scanner IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned IPA on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Compile Swift App directly
        run: |
          mkdir -p Payload/HueHeritageScanner.app
          
          # Biên dịch trực tiếp Swift cho chip Apple ARM64 (iPhone)
          xcrun -sdk iphoneos swiftc \
                -target arm64-apple-ios16.0 \
                -O \
                -framework SwiftUI \
                -framework ARKit \
                -framework SceneKit \
                -framework Combine \
                -framework Metal \
                -framework AVFoundation \
                -framework Network \
                HueHeritageScannerApp.swift \
                ARScannerManager.swift \
                ContentView.swift \
                QRScannerView.swift \
                TCPStreamClient.swift \
                -o Payload/HueHeritageScanner.app/HueHeritageScanner
          
          # Sao chép Info.plist và App Icons vào gói ứng dụng
          cp Info.plist Payload/HueHeritageScanner.app/Info.plist
          cp AppIcon*.png Payload/HueHeritageScanner.app/ 2>/dev/null || true
          cp iTunesArtwork.png Payload/HueHeritageScanner.app/ 2>/dev/null || true
          
          # Đóng gói tệp IPA
          zip -r HueHeritageScanner.ipa Payload
          echo "✅ Đã đóng gói thành công tệp IPA trực tiếp!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HueHeritageScanner-v3.0-IPA
          path: HueHeritageScanner.ipa

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0
          name: "Hue Heritage Scanner v3.0 (QR Connect & Real-time HUE1 Streaming)"
          body: "Bản phát hành v3.0: Quét mã QR tự động kết nối PC (hue1://), truyền dữ liệu nhị phân HUE1 Z-up thời gian thực trên cổng 18080, tương thích Windows Mobile Hotspot và hiệu chuẩn kích thước thực tế (Scale Calibration)."
          files: HueHeritageScanner.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
