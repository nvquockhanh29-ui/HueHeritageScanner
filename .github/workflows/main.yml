name: Build Hue Heritage Scanner IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build Unsigned IPA on Cloud Mac
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Setup Project via Xcodegen
        run: |
          cat << 'EOF' > project.yml
          name: HueHeritageScanner
          options:
            bundleIdPrefix: com.vietsoftpro
            deploymentTarget:
              iOS: "16.0"
          targets:
            HueHeritageScanner:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [.]
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: "Huế Scanner"
                  NSCameraUsageDescription: "Quét 3D LiDAR bảo tồn di tích"
          EOF
          
          brew install xcodegen
          xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project HueHeritageScanner.xcodeproj \
                     -scheme HueHeritageScanner \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "HueHeritageScanner.app" -type d | head -n 1)
          echo "Found app at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r HueHeritageScanner.ipa Payload
          echo "✅ Đã đóng gói thành công tệp IPA!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HueHeritageScanner-IPA
          path: HueHeritageScanner.ipa
