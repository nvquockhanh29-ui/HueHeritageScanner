name: HueHeritageAR
options:
  bundleIdPrefix: com.vietsoftpro
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HueHeritageAR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HueHeritageAR
        excludes:
          - "Info.plist"
    info:
      path: HueHeritageAR/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vietsoftpro.hueheritagear
        INFOPLIST_FILE: HueHeritageAR/Info.plist
        SWIFT_VERSION: "5.0"
